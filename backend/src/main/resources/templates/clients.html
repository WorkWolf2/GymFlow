<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(title='Clienti', hideNav=false, content=~{::div.clients-content})}">
<body>
    <div class="clients-content space-y-5">
        <!-- Page Header -->
        <div class="flex items-center justify-between stagger-item flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-foreground">Clienti</h1>
                <p class="text-xs text-foreground-muted mt-1 tabular-nums flex items-center gap-1.5" id="total-clients-text">
                    <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
                    Caricamento elenco clienti...
                </p>
            </div>
            <a href="/clients/new" class="btn-primary flex items-center gap-2 shadow-sm hover:shadow transition-all">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span>Nuovo cliente</span>
            </a>
        </div>

        <!-- Controls: Search & Filter Bar -->
        <div class="flex items-center justify-between gap-3 stagger-item flex-wrap">
            <div class="relative flex-1 max-w-sm">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-foreground-subtle w-4 h-4"></i>
                <input type="text" id="search-input" class="input pl-10 text-xs py-2.5 rounded-xl border border-surface-border bg-surface/40 hover:bg-surface/70 focus:bg-surface hover:border-surface-border/80 focus:border-accent transition-all" placeholder="Cerca per ID, nome, cognome, email...">
            </div>
            <div class="flex items-center gap-2.5 text-xs text-foreground-muted">
                <span class="hidden sm:inline text-foreground-subtle font-medium">Indicatori:</span>
                <span class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium select-none shadow-sm">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Torna
                </span>
                <span class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium select-none shadow-sm">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse-slow"></span> A rischio
                </span>
            </div>
        </div>

        <!-- Table Container -->
        <div class="card overflow-hidden border border-surface-border rounded-xl shadow-sm stagger-item bg-surface">
            <!-- Table Sub-Header -->
            <div class="grid grid-cols-[40px_1fr_auto] sm:grid-cols-[40px_2.2fr_1.4fr_90px] gap-3 sm:gap-5 px-6 py-3.5 border-b border-surface-border bg-surface-hover/20 text-[10px] font-bold text-foreground-subtle tracking-wider uppercase select-none">
                <div class="w-10 shrink-0"></div>
                <div class="flex items-center gap-1">
                    Cliente &amp; Info
                    <i data-lucide="arrow-down-az" class="w-3.5 h-3.5 text-accent/80"></i>
                </div>
                <div class="hidden sm:block text-right">Stato &amp; Abbonamento</div>
                <div class="text-right">Azioni</div>
            </div>

            <!-- Client Rows -->
            <div id="clients-list" class="divide-y divide-surface-border/60">
                <!-- Skeleton Loader -->
                <div id="loading-skeleton" class="space-y-0">
                    <div class="grid grid-cols-[40px_1fr] sm:grid-cols-[40px_2.2fr_1.4fr_90px] gap-3 sm:gap-5 px-6 py-4 border-b border-surface-border/40 animate-pulse items-center">
                        <div class="w-10 h-10 rounded-full bg-surface-active shrink-0"></div>
                        <div class="space-y-2">
                            <div class="h-3.5 bg-surface-active rounded w-48"></div>
                            <div class="h-2.5 bg-surface-active rounded w-32"></div>
                            <div class="h-3 bg-surface-active rounded w-64"></div>
                        </div>
                        <div class="hidden sm:flex items-center gap-2 justify-end">
                            <div class="h-6 bg-surface-active rounded-full w-20"></div>
                            <div class="h-6 bg-surface-active rounded-full w-24"></div>
                        </div>
                        <div class="hidden sm:block">
                            <div class="h-8 bg-surface-active rounded w-8 ml-auto"></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-[40px_1fr] sm:grid-cols-[40px_2.2fr_1.4fr_90px] gap-3 sm:gap-5 px-6 py-4 border-b border-surface-border/40 animate-pulse items-center">
                        <div class="w-10 h-10 rounded-full bg-surface-active shrink-0"></div>
                        <div class="space-y-2">
                            <div class="h-3.5 bg-surface-active rounded w-40"></div>
                            <div class="h-2.5 bg-surface-active rounded w-28"></div>
                            <div class="h-3 bg-surface-active rounded w-56"></div>
                        </div>
                        <div class="hidden sm:flex items-center gap-2 justify-end">
                            <div class="h-6 bg-surface-active rounded-full w-20"></div>
                            <div class="h-6 bg-surface-active rounded-full w-20"></div>
                        </div>
                        <div class="hidden sm:block">
                            <div class="h-8 bg-surface-active rounded w-8 ml-auto"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination Controls (moved inside table card) -->
            <div id="pagination-controls" class="flex items-center justify-between px-6 py-3.5 border-t border-surface-border bg-surface-hover/10 hidden">
                <p class="text-xs text-foreground-muted tabular-nums" id="page-info"></p>
                <div class="flex items-center gap-2">
                    <button id="prev-page" class="btn-ghost text-xs px-3.5 py-1.5 rounded-lg border border-surface-border hover:bg-surface-active hover:text-foreground disabled:opacity-30 disabled:pointer-events-none transition-all duration-150 flex items-center gap-1">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Precedente</span>
                    </button>
                    <button id="next-page" class="btn-ghost text-xs px-3.5 py-1.5 rounded-lg border border-surface-border hover:bg-surface-active hover:text-foreground disabled:opacity-30 disabled:pointer-events-none transition-all duration-150 flex items-center gap-1">
                        <span class="hidden sm:inline">Successiva</span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <script>
            $(document).ready(function() {
                let currentPage = 0;
                let currentSearch = "";
                let totalPages = 0;

                function loadClients() {
                    const list = $('#clients-list');
                    list.html($('#loading-skeleton').html());

                    $.ajax({
                        url: `/api/users?page=${currentPage}&size=10&search=${encodeURIComponent(currentSearch)}`,
                        type: 'GET',
                        success: function(data) {
                            list.empty();

                            $('#total-clients-text').html(`
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <strong>${data.page.totalElements}</strong> clienti registrati in totale
                            `);
                            
                            totalPages = data.page.totalPages;
                            
                            if (data.content.length === 0) {
                                list.html(`
                                    <div class="flex flex-col items-center justify-center px-6 py-16 text-center space-y-4">
                                        <div class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-active border border-surface-border text-foreground-subtle">
                                            <i data-lucide="users" class="w-6 h-6"></i>
                                        </div>
                                        <div class="space-y-1">
                                            <p class="text-sm font-semibold text-foreground">
                                                ${currentSearch ? "Nessun risultato trovato" : "Nessun cliente registrato"}
                                            </p>
                                            <p class="text-xs text-foreground-muted max-w-xs mx-auto">
                                                ${currentSearch ? "Prova a controllare l'ortografia o a inserire termini diversi." : "Inizia registrando un nuovo utente cliccando sul pulsante in alto."}
                                            </p>
                                        </div>
                                    </div>
                                `);
                                if (window.lucide) lucide.createIcons();
                            } else {
                                data.content.forEach(function(user) {
                                    const avatar = user.avatarPath 
                                        ? `<img src="${user.avatarPath}" alt="" class="w-10 h-10 rounded-full object-cover" />`
                                        : `<span class="text-xs font-bold text-foreground-muted uppercase">${(user.firstName || 'C')[0]}${(user.lastName || '')[0]}</span>`;
                                    
                                    const subStatus = user.hasActiveSubscription
                                        ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse-slow"></span>Abbonato</span>`
                                        : `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20"><span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>Scaduto</span>`;
                                    
                                    let certBadge = '';
                                    if (user.certStatus === 'VALID') {
                                        certBadge = '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><i data-lucide="award" class="w-3 h-3"></i>Cert. Valido</span>';
                                    } else if (user.certStatus === 'EXPIRING_SOON') {
                                        certBadge = '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20"><i data-lucide="alert-triangle" class="w-3 h-3"></i>Cert. Scadenza</span>';
                                    } else {
                                        certBadge = '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20"><i data-lucide="alert-circle" class="w-3 h-3"></i>Cert. Scaduto</span>';
                                    }
 
                                    const nfcBadge = user.nfcTagUid 
                                        ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-mono text-[11px] bg-accent/10 text-accent border border-accent/25" title="Codice Tag NFC"><i data-lucide="contact" class="w-3 h-3"></i>NFC: ${user.nfcTagUid}</span>` 
                                        : `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-mono text-[11px] bg-surface-active text-foreground-muted border border-surface-border" title="Codice Cliente"><i data-lucide="hash" class="w-3 h-3"></i>Cod: ${user.clientCode || '-'}</span>`;
 
                                    // Build Return Prediction 5 Rounded Squares Indicator & Sub-line
                                    let predictionBlocksHtml = '';
                                    let predLabel = 'Nessun dato';
                                    let predColor = '#9ca3af';
 
                                    if (user.returnPrediction) {
                                        const pred = user.returnPrediction;
                                        predLabel = pred.label;
                                        predColor = pred.color;
                                        const colors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#10b981'];
 
                                        for (let i = 1; i <= 5; i++) {
                                            const active = i <= pred.activeBlocks;
                                            const blockColor = colors[i - 1];
                                            const style = active
                                                ? `background-color: ${blockColor}; border-color: ${blockColor}; box-shadow: 0 0 5px ${blockColor}66;`
                                                : 'background-color: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); opacity: 0.25;';
                                            predictionBlocksHtml += `<span class="w-2.5 h-2.5 rounded-[2px] border inline-block transition-all" style="${style}"></span>`;
                                        }
                                    }

                                    const contactIcon = (user.email && user.email.includes('@'))
                                        ? `<i data-lucide="mail" class="w-3.5 h-3.5 text-foreground-subtle/70"></i>`
                                        : (user.phone ? `<i data-lucide="phone" class="w-3.5 h-3.5 text-foreground-subtle/70"></i>` : `<i data-lucide="alert-circle" class="w-3.5 h-3.5 text-foreground-subtle/50"></i>`);
 
                                    const html = `
                                        <div class="grid grid-cols-[40px_1fr_auto] sm:grid-cols-[40px_2.2fr_1.4fr_90px] gap-3 sm:gap-5 px-6 py-4 hover:bg-surface-hover/30 transition-all duration-200 relative group items-center">
                                            <!-- Return Prediction Color Indicator line -->
                                            <div class="absolute left-0 top-0 bottom-0 w-[3px] transition-all group-hover:w-[4px]" style="background-color: ${predColor};"></div>

                                            <!-- Avatar -->
                                            <div class="w-10 h-10 rounded-full bg-background-tertiary border border-surface-border flex items-center justify-center shrink-0 shadow-sm overflow-hidden select-none">
                                                ${avatar}
                                            </div>
 
                                            <!-- Main Info & Sub-line -->
                                            <div class="min-w-0 space-y-1">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <a href="/clients/${user.id}" class="text-sm font-semibold text-foreground group-hover:text-accent transition-colors truncate">
                                                        ${user.fullName}
                                                    </a>
                                                    ${user.clientCode ? `<span class="inline-flex items-center text-[10px] font-mono px-1.5 py-0.2 rounded bg-surface-active/60 border border-surface-border/80 text-foreground-muted">#${user.clientCode}</span>` : ''}
                                                </div>
 
                                                <p class="text-xs text-foreground-subtle truncate flex items-center gap-1.5">
                                                    ${contactIcon}
                                                    <span>${user.email || user.phone || "Nessun recapito"}</span>
                                                </p>
 
                                                <!-- SUB-LINE: Under Client Name/Contact -->
                                                <div class="flex items-center gap-3 pt-0.5 flex-wrap">
                                                    <!-- 5 Quadratini colorati predittivi -->
                                                    <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded border border-surface-border bg-background-tertiary/60 text-[11px] shrink-0" title="Probabilità di ritorno: ${user.returnPrediction ? user.returnPrediction.score + '%' : ''}">
                                                        <div class="flex items-center gap-0.5">
                                                            ${predictionBlocksHtml}
                                                        </div>
                                                        <span class="font-semibold text-[11px] tracking-wide" style="color: ${predColor}">${predLabel}</span>
                                                    </div>
 
                                                    <!-- Da quanto tempo non viene in palestra -->
                                                    <div class="inline-flex items-center gap-1 text-[11px] text-foreground-subtle shrink-0">
                                                        <i data-lucide="history" class="w-3.5 h-3.5 text-foreground-subtle/80"></i>
                                                        <span>Ultimo ingresso: <strong class="text-foreground-muted font-medium">${user.timeAgoText || 'Mai venuto'}</strong></span>
                                                    </div>
                                                </div>
                                            </div>
 
                                            <!-- Badges Column -->
                                            <div class="hidden sm:flex items-center gap-2 shrink-0 flex-wrap justify-end">
                                                ${certBadge}
                                                ${subStatus}
                                                ${nfcBadge}
                                            </div>
 
                                            <!-- Action Column -->
                                            <div class="flex items-center gap-1.5 justify-end">
                                                <a href="/clients/${user.id}" class="p-2 rounded-lg text-foreground-muted hover:text-accent hover:bg-accent/10 transition-all" title="Apri scheda cliente">
                                                    <i data-lucide="eye" class="w-4 h-4"></i>
                                                </a>
                                                <div class="relative dropdown-container">
                                                    <button class="dropdown-toggle p-2 rounded-lg text-foreground-muted hover:text-foreground hover:bg-surface-active transition-all" title="Altre opzioni">
                                                        <i data-lucide="more-horizontal" class="w-4 h-4"></i>
                                                    </button>
                                                    <div class="dropdown-menu absolute right-0 top-full mt-1.5 w-48 bg-surface border border-surface-border rounded-xl shadow-card z-20 py-1.5 hidden animate-slide-up">
                                                        <a href="/clients/${user.id}" class="flex items-center gap-2 px-3.5 py-2.5 text-xs text-foreground-muted hover:text-foreground hover:bg-surface-hover transition-colors">
                                                            <i data-lucide="user-check" class="w-4 h-4 text-foreground-muted/80"></i> Vedi Scheda
                                                        </a>
                                                        <button class="delete-btn flex items-center gap-2 px-3.5 py-2.5 text-xs text-danger hover:bg-danger-bg/50 w-full text-left transition-colors" data-id="${user.id}">
                                                            <i data-lucide="user-x" class="w-4 h-4 text-danger/80"></i> Disattiva Cliente
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                    list.append(html);
                                });
                                if (window.lucide) lucide.createIcons();
                            }

                            // Update Pagination
                            if (totalPages > 1) {
                                $('#pagination-controls').removeClass('hidden');
                                $('#page-info').text(`Pagina ${currentPage + 1} di ${totalPages}`);
                                $('#prev-page').prop('disabled', currentPage === 0);
                                $('#next-page').prop('disabled', currentPage >= totalPages - 1);
                            } else {
                                $('#pagination-controls').addClass('hidden');
                            }
                        }
                    });
                }

                // Initial Load
                window.LegionAsdRefreshClients = loadClients;
                loadClients();

                // Search Event
                let searchTimeout;
                $('#search-input').on('input', function() {
                    currentSearch = $(this).val();
                    currentPage = 0;
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(loadClients, 300);
                });

                // Pagination Events
                $('#prev-page').click(function() {
                    if (currentPage > 0) {
                        currentPage--;
                        loadClients();
                    }
                });

                $('#next-page').click(function() {
                    if (currentPage < totalPages - 1) {
                        currentPage++;
                        loadClients();
                    }
                });

                // Dropdown logic
                $(document).on('click', '.dropdown-toggle', function(e) {
                    e.stopPropagation();
                    $('.dropdown-menu').addClass('hidden');
                    $(this).siblings('.dropdown-menu').removeClass('hidden');
                });

                $(document).on('click', function() {
                    $('.dropdown-menu').addClass('hidden');
                });

                // Delete logic
                $(document).on('click', '.delete-btn', function() {
                    const id = $(this).data('id');
                    if (confirm("Disattivare questo cliente?")) {
                        $.ajax({
                            url: `/api/users/${id}`,
                            type: 'DELETE',
                            success: function() {
                                loadClients();
                            }
                        });
                    }
                });
            });
        </script>
    </div>
</body>
</html>
