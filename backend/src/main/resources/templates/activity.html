<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(title='Attività', hideNav=false, content=~{::div.activity-content})}">
<body>
<div class="activity-content space-y-5">
    <div>
        <h1 class="text-xl font-semibold text-foreground">Attività account</h1>
        <p class="text-sm text-foreground-muted mt-0.5">Cronologia delle operazioni effettuate dagli account della palestra.</p>
    </div>

    <div class="card overflow-hidden">
        <div id="activity-loading" class="p-6 text-sm text-foreground-muted">Caricamento attività...</div>
        <div id="activity-empty" class="hidden p-6 text-sm text-foreground-muted">Non sono ancora state registrate attività.</div>
        <div id="activity-list" class="divide-y divide-surface-border"></div>
        <div id="activity-pagination" class="hidden items-center justify-between border-t border-surface-border px-6 py-3.5 bg-surface-hover/10 text-xs">
            <p id="activity-page" class="text-foreground-muted tabular-nums"></p>
            <div class="flex items-center gap-2">
                <button id="activity-prev" class="btn-ghost text-xs px-3.5 py-1.5 rounded-lg border border-surface-border hover:bg-surface-active hover:text-foreground disabled:opacity-30 disabled:pointer-events-none transition-all duration-150 flex items-center gap-1">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    <span>Precedente</span>
                </button>
                <button id="activity-next" class="btn-ghost text-xs px-3.5 py-1.5 rounded-lg border border-surface-border hover:bg-surface-active hover:text-foreground disabled:opacity-30 disabled:pointer-events-none transition-all duration-150 flex items-center gap-1">
                    <span>Successiva</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            let page = 0;
            let totalPages = 0;
            let isLoading = false;
            let currentRequest = null;
            const pageSize = 20;

            const labels = {
                USER_CREATED: 'ha creato un cliente', USER_UPDATED: 'ha aggiornato un cliente', USER_DELETED: 'ha eliminato un cliente',
                USER_AVATAR_UPDATED: 'ha aggiornato la foto cliente', USER_SIGNATURE_UPDATED: 'ha aggiornato una firma', USER_DOCUMENTS_UPDATED: 'ha aggiornato documenti cliente',
                CERTIFICATE_SAVED: 'ha aggiornato un certificato', PAYMENT_CREATED: 'ha registrato un incasso',
                PAYMENT_DELETED: 'ha eliminato un incasso', SUBSCRIPTION_CREATED: 'ha creato un abbonamento',
                SUBSCRIPTION_UPDATED: 'ha aggiornato un abbonamento', SUBSCRIPTION_DELETED: 'ha eliminato un abbonamento',
                STOP_AND_GO_APPLIED: 'ha applicato Stop & Go', NFC_TAG_ASSIGNED: 'ha assegnato un tag NFC',
                NFC_TAG_UNASSIGNED: 'ha rimosso un tag NFC', NFC_TAG_DEACTIVATED: 'ha disattivato un tag NFC',
                DOSSIER_PROFILE_SAVED: 'ha aggiornato un dossier', DOSSIER_PROGRESS_CREATED: 'ha aggiunto un progresso',
                DOSSIER_PROGRESS_UPDATED: 'ha aggiornato un progresso', DOSSIER_PROGRESS_DELETED: 'ha eliminato un progresso',
                DOSSIER_PROGRAM_CREATED: 'ha creato una scheda', DOSSIER_PROGRAM_DELETED: 'ha eliminato una scheda',
                DOSSIER_NOTE_CREATED: 'ha aggiunto una nota', DOSSIER_NOTE_UPDATED: 'ha aggiornato una nota',
                DOSSIER_NOTE_DELETED: 'ha eliminato una nota', DOSSIER_DOCUMENT_CREATED: 'ha aggiunto un documento',
                DOSSIER_DOCUMENT_DELETED: 'ha eliminato un documento',
                STAFF_USER_CREATED: 'ha creato un account', STAFF_USER_UPDATED: 'ha aggiornato un account', STAFF_USER_DELETED: 'ha eliminato un account'
            };

            function escapeHtml(value) {
                return String(value || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
            }

            function loadActivity() {
                if (currentRequest && currentRequest.readyState !== 4) {
                    currentRequest.abort();
                }

                isLoading = true;
                $('#activity-prev, #activity-next').prop('disabled', true);
                $('#activity-loading').removeClass('hidden');

                currentRequest = $.ajax({
                    url: '/api/activity',
                    type: 'GET',
                    data: { page: page, size: pageSize },
                    success: function(result) {
                        const totalElements = result.totalElements != null 
                            ? result.totalElements 
                            : (result.page && result.page.totalElements != null ? result.page.totalElements : (result.content ? result.content.length : 0));

                        totalPages = result.totalPages != null 
                            ? result.totalPages 
                            : (result.page && result.page.totalPages != null ? result.page.totalPages : (totalElements > 0 ? Math.ceil(totalElements / pageSize) : 0));

                        const items = result.content || [];
                        $('#activity-list').empty();
                        $('#activity-empty').toggleClass('hidden', items.length !== 0);

                        items.forEach(function(item) {
                            const date = item.createdAt ? new Date(item.createdAt).toLocaleString('it-IT') : 'Data non disponibile';
                            const description = labels[item.action] || item.action.replaceAll('_', ' ').toLowerCase();
                            $('#activity-list').append(
                                '<div class="flex items-start gap-3 p-4 hover:bg-surface-hover/30 transition-colors">' +
                                '<div class="mt-0.5 rounded-lg bg-accent/10 p-2 text-accent border border-accent/20"><i data-lucide="activity" class="w-4 h-4"></i></div>' +
                                '<div class="min-w-0 flex-1"><p class="text-sm text-foreground"><strong>' + escapeHtml(item.staffUserName) + '</strong> ' + escapeHtml(description) + '</p>' +
                                '<p class="mt-1 text-xs text-foreground-muted">' + escapeHtml(item.entityType || 'Operazione') + ' · ' + escapeHtml(date) + '</p></div></div>'
                            );
                        });

                        if (totalPages > 1) {
                            $('#activity-pagination').removeClass('hidden').addClass('flex');
                            $('#activity-page').html(`Pagina <strong>${page + 1}</strong> di <strong>${totalPages}</strong> (${totalElements} attività)`);
                            $('#activity-prev').prop('disabled', page === 0);
                            $('#activity-next').prop('disabled', page >= totalPages - 1);
                        } else {
                            $('#activity-pagination').addClass('hidden').removeClass('flex');
                        }

                        if (window.lucide) lucide.createIcons();
                    },
                    error: function(xhr, status) {
                        if (status !== 'abort') {
                            console.error('Errore nel caricamento delle attività:', xhr);
                        }
                    },
                    complete: function(xhr, status) {
                        isLoading = false;
                        $('#activity-loading').addClass('hidden');
                        if (status !== 'abort') {
                            $('#activity-prev').prop('disabled', page === 0);
                            $('#activity-next').prop('disabled', page >= totalPages - 1);
                        }
                    }
                });
            }

            $('#activity-prev').off('click').on('click', function(e) {
                e.preventDefault();
                if (!isLoading && page > 0) {
                    page--;
                    loadActivity();
                }
            });

            $('#activity-next').off('click').on('click', function(e) {
                e.preventDefault();
                if (!isLoading && page < totalPages - 1) {
                    page++;
                    loadActivity();
                }
            });

            loadActivity();
        });
    </script>
</div>
</body>
</html>
